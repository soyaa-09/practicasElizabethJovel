<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
</head>
<body>
    <h1>Hello, People!</h1>
 
    <script>
      let name, numero1, numero2, numero3;
 
      name = prompt("Ingrese su nombre:");
      numero1 = Number(prompt("Ingrese la primera nota:"));
      numero2 = Number(prompt("Ingrese la segunda nota:"));
      numero3 = Number(prompt("Ingrese la tercera nota:"));
 
      let total = (numero1 * 0.3) + (numero2 * 0.35) + (numero3 * 0.35);
      document.write("Hola, " + name + "! El resultado de tu promedio es: " + total);
    </script>
 
</body>
</html>
